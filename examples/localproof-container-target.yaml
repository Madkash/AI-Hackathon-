schema_version: "0.1-draft"
target:
  name: "localproof-compliance-console"
  version: "0.1.0"
  environment: "isolated-local-test"
  source_path: "/workspace/project/compliance-console"
interfaces:
  web:
    base_url: "http://console:3000"
    status: "compose-local"
scope:
  active_testing: false
  allowed_hosts:
    - "console"
  allowed_ports:
    - 3000
  excluded_paths: []
  maximum_requests_per_second: 2
  maximum_concurrent_requests: 1
data_handling:
  external_network: "deny"
  use_synthetic_test_data: true
  secrets_in_manifest: "forbidden"
