schema_version: "0.1-draft"
target:
  name: "localproof-compliance-console"
  version: "0.1.0"
  environment: "isolated-local-test"
  source_path: "C:/Projects/dell x nvidia hackathon/compliance-console"
interfaces:
  web:
    base_url: "http://localhost:3000"
    status: "verified-for-local-test"
scope:
  active_testing: true
  allowed_hosts:
    - "localhost"
